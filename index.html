<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>portofolio jemy</title>

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

body {
  overflow:hidden;
  background:black;
}

/* SLIDER */
.container {
  display:flex;
  width:400vw;
  height:100vh;
  transition: transform 0.7s cubic-bezier(0.77, 0, 0.175, 1);
  will-change: transform;
}

/* PAGE */
section {
  width:100vw;
  height:100vh;
  position:relative;
  flex-shrink:0;
  color:white;
}

/* BACKGROUND */
.bg {
  position:absolute;
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
  filter:brightness(0.55);
}

/* OVERLAY */
.overlay {
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(to right, rgba(0,0,0,0.85), rgba(0,0,0,0.3));
}

/* CONTENT */
.content {
  position:absolute;
  top:50%;
  left:80px;
  transform:translateY(-50%);
  max-width:520px;
}

.box {
  background:rgba(255,255,255,0.08);
  padding:30px;
  border-radius:20px;
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

/* TEXT */
h1 {
  font-size:48px;
  margin-bottom:10px;
}

p {
  font-size:16px;
  line-height:1.6;
  opacity:0.9;
}

/* IMAGE */
.img-box img {
  width:100%;
  margin-top:15px;
  border-radius:12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

/* NAVBAR */
.navbar {
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:18px;
  background:rgba(0,0,0,0.6);
  padding:10px 20px;
  border-radius:25px;
  z-index:999;
  backdrop-filter: blur(10px);
}

.navbar a {
  color:white;
  text-decoration:none;
  cursor:pointer;
  font-size:14px;
  opacity:0.85;
}

.navbar a:hover {
  opacity:1;
}

/* BUTTON */
.btn {
  position:fixed;
  top:50%;
  transform:translateY(-50%);
  font-size:26px;
  background:rgba(0,0,0,0.5);
  border:none;
  color:white;
  padding:10px 14px;
  cursor:pointer;
  z-index:999;
  border-radius:12px;
}

.left { left:12px; }
.right { right:12px; }

</style>
</head>

<body>

<div class="navbar">
  <a onclick="go(0)">home</a>
  <a onclick="go(1)">tentang</a>
  <a onclick="go(2)">skill</a>
  <a onclick="go(3)">hobby</a>
</div>

<button class="btn left" onclick="move(-1)">❮</button>
<button class="btn right" onclick="move(1)">❯</button>

<div class="container" id="slider">

  <!-- HOME -->
  <section>
    <div class="bg" style="background-image:url('bg1.jpg')"></div>
    <div class="overlay"></div>
    <div class="content box">
      <h1>hai, saya jemy</h1>
      <p>portofolio sederhana, clean, dan profesional.</p>
    </div>
  </section>

  <!-- TENTANG -->
  <section>
    <div class="bg" style="background-image:url('bg2.jpg')"></div>
    <div class="overlay"></div>
    <div class="content box">
      <h1>tentang</h1>
      <p>saya sedang belajar teknologi dan terus berkembang setiap hari.</p>
    </div>
  </section>

  <!-- SKILL -->
  <section>
    <div class="bg" style="background-image:url('bg3.jpg')"></div>
    <div class="overlay"></div>
    <div class="content box">
      <h1>skill</h1>
      <p>mekanik kendaraan ringan</p>

      <!-- FIX: skill1 harus di sini -->
      <div class="img-box">
        <img src="skill1.jpg" alt="skill">
      </div>

    </div>
  </section>

  <!-- HOBBY -->
  <section>
    <div class="bg" style="background-image:url('bg4.jpg')"></div>
    <div class="overlay"></div>
    <div class="content box">
      <h1>hobby</h1>
      <p>berkelana</p>

      <!-- FIX: hobby1 harus di sini -->
      <div class="img-box">
        <img src="hobby1.jpg" alt="hobby">
      </div>

    </div>
  </section>

</div>

<script>
let index = 0;
const slider = document.getElementById("slider");

function update(){
  slider.style.transform = `translateX(-${index * 100}vw)`;
}

function move(dir){
  index += dir;
  if(index < 0) index = 0;
  if(index > 3) index = 3;
  update();
}

function go(i){
  index = i;
  update();
}

/* swipe HP biar makin keren */
let startX = 0;

document.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e => {
  let endX = e.changedTouches[0].clientX;

  if(startX - endX > 50) move(1);
  if(endX - startX > 50) move(-1);
});
</script>

</body>
</html>
