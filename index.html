<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>JEMY PORTFOLIO</title>
<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
  text-align:center;
}

section{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.nav{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
}

.nav button{
  margin:5px;
  padding:8px 12px;
  cursor:pointer;
}

.box{
  background:rgba(255,255,255,0.1);
  padding:20px;
  border-radius:10px;
}

img{
  width:150px;
  margin-top:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="nav">
  <button onclick="go(0)">HOME</button>
  <button onclick="go(1)">TENTANG</button>
  <button onclick="go(2)">SKILL</button>
  <button onclick="go(3)">HOBBY</button>
</div>

<section>
  <div class="box">
    <h1>HI, INI JEMY</h1>
    <p>Portfolio sederhana</p>
  </div>
</section>

<section>
  <h1>TENTANG</h1>
  <p>Belajar otomotif & teknologi</p>
</section>

<section>
  <h1>SKILL</h1>
  <p>Motor: bore up, tune up, service</p>
  <img src="skill1.jpg">
</section>

<section>
  <h1>HOBBY</h1>
  <p>Gunung, pantai, curug, bukit</p>
  <img src="hobby1.jpg">
</section>

<script>
let sections = document.querySelectorAll("section");

function go(i){
  sections[i].scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
