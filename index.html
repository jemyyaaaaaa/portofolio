<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>portofolio jemy</title>

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

body {
  overflow:hidden;
  background:black;
}

/* slider utama */
.container {
  display:flex;
  width:400vw;
  height:100vh;
  transition: transform 0.6s ease;
}

/* tiap halaman */
section {
  width:100vw;
  height:100vh;
  position:relative;
  flex-shrink:0;
  color:white;
}

/* background */
.bg {
  position:absolute;
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
  filter:brightness(0.5);
}

/* overlay */
.overlay {
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(to right,#000000cc,#00000055);
}

/* content */
.content {
  position:absolute;
  top:50%;
  left:80px;
  transform:translateY(-50%);
  max-width:500px;
}

.box {
  background:rgba(255,255,255,0.08);
  padding:30px;
  border-radius:20px;
  backdrop-filter: blur(10px);
}

/* text */
h1 {
  font-size:50px;
  margin-bottom:10px;
}

p {
  font-size:16px;
  line-height:1.6;
}

/* navbar */
.navbar {
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:20px;
  background:rgba(0,0,0,0.5);
  padding:10px 20px;
  border-radius:20px;
  z-index:999;
}

.navbar a {
  color:white;
  text-decoration:none;
  cursor:pointer;
}

/* image */
.img-box img {
  width:100%;
  margin-top:15px;
  border-radius:10px;
}

/* button */
.btn {
  position:fixed;
  top:50%;
  transform:translateY(-50%);
  font-size:25px;
  background:rgba(0,0,0,0.5);
  border:none;
  color:white;
  padding:10px;
  cursor:pointer;
  z-index:999;
}

.left { left:10px; }
.right { right:10px; }

</style>
</head>

<body>

<div class="navbar">
  <a onclick="go(0)">home</a>
  <a onclick="go(1)">tentang</a>
  <a onclick="go(2)">skill</a>
  <a onclick="go(3)">hobby</a>
</div>

<button class="btn left" onclick="move(-1)">❮</button>
<button class="btn right" onclick="move(1)">❯</button>

<div class="container" id="slider">

  <section>
    <div class="bg" style="background-image:url('bg1.jpg')"></div>
    <div class="overlay"></div>
    <div class="content box">
      <h1>hai, saya jemy</h1>
      <p>ini portofolio saya dengan tampilan sederhana dan profesional.</p>
    </div>
  </section>

  <section>
    <div class="bg" style="background-image:url('bg2.jpg')"></div>
    <div class="overlay"></div>
    <div class="content box">
      <h1>TENTANG</h1>
      <p>saya sedang belajar dan berkembang di dunia teknologi.</p>
    </div>
  </section>

  <section>
    <div class="bg" style="background-image:url('bg3.jpg')"></div>
    <div class="overlay"></div>
    <div class="content box">
      <h1>SKILL</h1>
      <p>mekanik kendaraan ringan</p>

      <!-- FOTO SKILL FIX DI HALAMAN INI -->
      <div class="img-box">
        <img src="skill1.jpg" alt="skill">
      </div>

    </div>
  </section>

  <section>
    <div class="bg" style="background-image:url('bg4.jpg')"></div>
    <div class="overlay"></div>
    <div class="content box">
      <h1>HOBBY</h1>
      <p>berkelana</p>

      <!-- FOTO HOBBY FIX DI HALAMAN INI -->
      <div class="img-box">
        <img src="hobby1.jpg" alt="hobby">
      </div>

    </div>
  </section>

</div>

<script>
let index = 0;
const slider = document.getElementById("slider");

function update(){
  slider.style.transform = `translateX(-${index * 100}vw)`;
}

function move(dir){
  index += dir;
  if(index < 0) index = 0;
  if(index > 3) index = 3;
  update();
}

function go(i){
  index = i;
  update();
}
</script>

</body>
</html>
